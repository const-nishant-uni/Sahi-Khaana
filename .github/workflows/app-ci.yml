# App CI: static analysis, unit tests, and a debug Android build.
name: App CI

on:
  push:
    branches: [master]
    paths: ["sahi_khaana_app/**", ".github/workflows/app-ci.yml"]
  pull_request:
    paths: ["sahi_khaana_app/**", ".github/workflows/app-ci.yml"]
  workflow_dispatch:
  workflow_call: # reused by app-release.yml

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sahi_khaana_app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-apk:
    name: Debug APK builds
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sahi_khaana_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sahi-khaana-debug-apk
          path: sahi_khaana_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
