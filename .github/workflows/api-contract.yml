# Contract check: run the REAL backend and drive every endpoint with the app's own Dart API layer
# (tool/api_smoke.dart). Fails if the app's models/endpoints and the backend drift apart.
name: API contract (app <-> backend)

on:
  push:
    branches: [master]
    paths:
      - "sahi-khaana-backend/**"
      - "sahi_khaana_app/**"
      - ".github/workflows/api-contract.yml"
  pull_request:
    paths:
      - "sahi-khaana-backend/**"
      - "sahi_khaana_app/**"
      - ".github/workflows/api-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sahi-khaana-backend/requirements.txt

      - name: Install Tesseract
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr

      - name: Install backend dependencies
        working-directory: sahi-khaana-backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install rapidocr-onnxruntime --no-deps

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Get app dependencies
        working-directory: sahi_khaana_app
        run: flutter pub get

      # The Groq key (repository secret GROQ_API_KEY) goes ONLY to this step, i.e. to the server.
      # Optional repository variable GROQ_MODEL overrides the model.
      - name: Start the backend
        working-directory: sahi-khaana-backend
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL_OVERRIDE: ${{ vars.GROQ_MODEL }}
        run: |
          # An EMPTY variable would override the built-in defaults with "", so export only what is set.
          if [ -n "$GROQ_MODEL_OVERRIDE" ]; then export GROQ_MODEL="$GROQ_MODEL_OVERRIDE"; fi
          if [ -n "$GROQ_API_KEY" ]; then
            echo "EXPECT_LLM=true" >> "$GITHUB_ENV"
          else
            unset GROQ_API_KEY
            echo "No GROQ_API_KEY secret: explanations will use the template."
          fi
          nohup python -m uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for _ in $(seq 1 60); do
            if curl -fs http://localhost:8000/api/v1/health >/dev/null; then echo "backend up"; exit 0; fi
            sleep 2
          done
          echo "backend did not start" >&2
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      # With a key the explanation MUST come from the LLM; without one the template is fine.
      - name: Run the smoke script against it
        working-directory: sahi_khaana_app
        run: |
          args=()
          if [ "$EXPECT_LLM" = "true" ]; then args+=(--expect-llm); fi
          dart run tool/api_smoke.dart --base http://localhost:8000/api/v1 "${args[@]}"

      - name: Backend log
        if: failure()
        run: cat "$RUNNER_TEMP/backend.log"
